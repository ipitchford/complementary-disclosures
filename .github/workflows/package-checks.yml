name: Exact evidence verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned solver
        run: python -m pip install -r requirements-checks.txt
      - name: Exact finite extension checks
        run: python -B code/verify_extensions.py
      - name: Optimization-safe extension checks
        run: python -B -O code/verify_extensions.py
      - name: Retained witnesses and solver-state controls
        run: python -B code/verify_assurance.py --results results/fresh-full
      - name: Optimization-safe witness checks
        run: python -B -O code/verify_assurance.py --results results/fresh-full
      - name: Frozen inventory
        run: python -B code/check_manifest.py
      - name: Manuscript table semantics
        run: python -B code/crosscheck_paper.py
      - name: Optimization-safe manuscript checks
        run: python -B -O code/crosscheck_paper.py
